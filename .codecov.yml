coverage:
  status:
    project:
      default:
        target: 80%  # Objectif de couverture globale
        threshold: 1%  # Tolérance de 1% pour les variations mineures
    patch:
      default:
        target: 75%  # Objectif pour les PRs
        threshold: 2%

  ignore:
    - "tests/"  # Ignorer les fichiers de test
    - "**/test_*.cpp"  # Ignorer les fichiers de test unitaires
    - "build/"  # Ignorer les fichiers générés
    - "**/*.pb.cc"  # Ignorer les fichiers protobuf générés
    - "**/*.pb.h"   # Ignorer les fichiers protobuf générés

comment:
  layout: "reach, diff, flags, files"
  behavior: default
  require_changes: false  # Ne pas exiger de changements pour commenter

github_checks:
  annotations: true
