name: CI/CD Pipeline

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]

jobs:
  test:
    name: Build and Test
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            compiler: gcc
            version: 11
            build_type: Debug
            sanitizer: OFF
          - os: ubuntu-22.04
            compiler: gcc
            version: 11
            build_type: Release
            sanitizer: OFF
          - os: ubuntu-22.04
            compiler: clang
            version: 14
            build_type: Debug
            sanitizer: OFF
          - os: ubuntu-22.04
            compiler: clang
            version: 14
            build_type: Release
            sanitizer: OFF
          # Sanitizer builds pour détecter les problèmes mémoire
          - os: ubuntu-22.04
            compiler: gcc
            version: 11
            build_type: Debug
            sanitizer: ON

    steps:
    - uses: actions/checkout@v4

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          cmake \
          build-essential \
          libboost-program-options-dev \
          libfuse3-dev \
          lcov \
          ninja-build \
          pkg-config

    - name: Set up ${{ matrix.compiler }} ${{ matrix.version }}
      run: |
        if [ "${{ matrix.compiler }}" = "gcc" ]; then
          sudo apt-get install -y gcc-${{ matrix.version }} g++-${{ matrix.version }}
          echo "CC=gcc-${{ matrix.version }}" >> $GITHUB_ENV
          echo "CXX=g++-${{ matrix.version }}" >> $GITHUB_ENV
        else
          sudo apt-get install -y clang-${{ matrix.version }} clang++-${{ matrix.version }}
          echo "CC=clang-${{ matrix.version }}" >> $GITHUB_ENV
          echo "CXX=clang++-${{ matrix.version }}" >> $GITHUB_ENV
        fi

    - name: Configure CMake
      run: |
        mkdir build && cd build
        cmake .. \
          -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
          -DSANITIZE=${{ matrix.sanitizer }} \
          -DBUILD_TESTS=ON \
          -DCMAKE_EXPORT_COMPILE_COMMANDS=ON

    - name: Build
      run: |
        cd build
        make -j$(nproc)

    - name: Run tests
      run: |
        cd build
        ctest --output-on-failure -j$(nproc)

    - name: Generate coverage report (Debug builds only)
      if: matrix.build_type == 'Debug' && matrix.sanitizer == 'OFF'
      run: |
        cd build
        # Générer le rapport de couverture avec lcov
        lcov --capture --directory . --output-file coverage.info --no-external
        # Exclure les fichiers système et de test
        lcov --remove coverage.info '/usr/*' '*/test_*' '*/tests/*' --output-file coverage.info
        # Générer le rapport HTML
        genhtml coverage.info --output-directory coverage-report

    - name: Upload coverage to Codecov
      if: matrix.build_type == 'Debug' && matrix.sanitizer == 'OFF'
      uses: codecov/codecov-action@v3
      with:
        file: ./build/coverage.info
        flags: ${{ matrix.compiler }}-${{ matrix.version }}-${{ matrix.build_type }}
        name: ${{ matrix.compiler }}-${{ matrix.version }}-${{ matrix.build_type }}
        fail_ci_if_error: false

    - name: Upload test artifacts
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: test-results-${{ matrix.compiler }}-${{ matrix.version }}-${{ matrix.build_type }}
        path: |
          build/Testing/
          build/coverage-report/
        retention-days: 7

  # Job séparé pour l'analyse statique
  static-analysis:
    name: Static Analysis
    runs-on: ubuntu-22.04

    steps:
    - uses: actions/checkout@v4

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          cmake \
          build-essential \
          libboost-program-options-dev \
          libfuse3-dev \
          cppcheck \
          clang-tidy-14

    - name: Configure CMake
      run: |
        mkdir build && cd build
        cmake .. -DCMAKE_BUILD_TYPE=Debug -DCMAKE_EXPORT_COMPILE_COMMANDS=ON

    - name: Run cppcheck
      run: |
        cd build
        cppcheck --enable=all --std=c++23 --language=c++ \
          --suppress=missingIncludeSystem \
          --suppress=unusedFunction \
          --inline-suppr \
          --xml --xml-version=2 \
          ../src 2> cppcheck-results.xml || true

    - name: Run clang-tidy
      run: |
        cd build
        # Configurer clang-tidy avec un profil moderne C++23
        echo "Checks: '-*,modernize-*,-modernize-use-trailing-return-type,performance-*,-performance-type-promotion-in-math-fn,readability-*,-readability-braces-around-statements,-readability-function-cognitive-complexity'" > .clang-tidy
        find ../src -name "*.cpp" -o -name "*.hpp" | head -20 | xargs clang-tidy-14 --format=xml -p . > clang-tidy-results.xml || true

    - name: Upload static analysis results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: static-analysis-results
        path: |
          build/cppcheck-results.xml
          build/clang-tidy-results.xml
        retention-days: 30
